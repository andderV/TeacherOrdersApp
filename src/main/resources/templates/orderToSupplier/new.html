<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">

    <title>Новый заказ</title>
</head>
<body>
<header th:replace="blocks/header :: header"></header>

<form th:method="POST" th:action="@{/orderToSupplier}" th:object="${order}">
    <label for="date">Выберите дату: </label>
    <input type="date" th:field="*{dateOrder}" id="date">
    <div style="color: red" th:if="${#fields.hasErrors('dateOrder')}" th:errors="*{dateOrder}">Date error</div>
    <br/>
    <label for="provider">Выберите поставщика:</label>
    <select th:object="${provider}" th:field="*{providerId}" id="provider">
        <option th:each="provider: ${providers}" th:value="${provider.providerId}"
                th:text="${provider.providerName}"/>
    </select>
    <label for="contract">Выберите контракт:</label>
    <select th:object="${contract}" th:field="*{contractId}" id="contract">
        <option th:each="contract: ${contracts}" th:value="${contract.contractId}"
                th:text="${contract.contractName}"/>
    </select>
    <form th:method="POST" th:action="@{/orderToSupGro}" th:object="${item}">
        <label for="product">Выберите продукт:</label>
        <select th:object="${productEmpty}" th:field="*{id}" id="product">
            <option th:each="prod: ${products}" th:value="${prod.id}"
                    th:text="${prod.getProduct().productName}"/>
        </select>
        <label for="quantityB">Введите количество бюджет:</label>
        <input type="text" th:field="*{quantityBudget}" id="quantityB">
        <div style="color: red" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantityBudget}">Name error</div>
    <label for="quantityBO">Введите количество внебюджет:</label>
        <input type="text" th:field="*{quantityOffBudget}" id="quantityBO">
        <div style="color: red" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantityOffBudget}">Name error</div>
    </form>
    <input type="submit" value="Добавить">
    <hr>
    <br>
    <br>
    <!--        <form th:method="POST" th:action="@{/orders/add}" th:object="${groceryItem}">-->
    <!--            <label for="grocery">Выберите продукт:</label>-->
    <!--            <select th:object="${product}" th:field="*{id}" id="grocery">-->
    <!--                <option th:each="grocery:${groceries}" th:value="${grocery.id}"-->
    <!--                        th:text="${grocery.productName} + ' ' + ${grocery.measureUnit.measureUnitName}"></option>-->
    <!--            </select>-->
    <!--            <label for="quantity">Введите количество</label>-->
    <!--            <input type="text" th:field="*{productId}" id="quantity">-->
    <!--            <input type="submit" value="Добавить">-->
    <!--        </form>-->
    <!--    <br>-->
    <!--    <br>-->
    <input type="submit" value="Создать новый заказ">
</form>
<h3>Текущий заказ:</h3>
<table class="table table-bordered table-striped">
    <thead>
    <tr>
        <th>Название поставщика</th>
        <th>Название контракта</th>
        <th>Название продукта</th>
        <th>Единица измерения</th>
        <th>Количество бюджет</th>
        <th>Количество внебюджет</th>
        <!--        <th>Дополнительная информация</th>-->
    </tr>
    </thead>
    <tbody>
    <tr th:each="item :${groceryItem}">
        <td th:text="${item.product.productName}"/>
        <td th:text="${item.quantityBudget}"/>
        <td th:text="${item.quantityOffBudget}"/>
        <td th:text="${item.product.nameBasicUnit}"/>
    </tr>
    </tbody>

</table>
</body>
</html>

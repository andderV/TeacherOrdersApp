<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">

    <title>Список единиц измерения</title>
</head>
<body>
<header th:replace="blocks/header :: header"></header>

<a th:text="${product.getProductName()}"></a>
<br/>
<div th:if="${!units.isEmpty()}">
    <hr/>
    <table>
        <thead>
        <tr>
            <th>Единица измерения</th>
            <th>Коэффициент</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="unit:${units}">
            <td th:style="${unit.getMeasureUnit().ratio == 1.0} ? 'background: yellow;'" th:href="@{/unit/{id}(id=${unit.getMeasureUnit().getMeasureUnitId()})}"
                th:text="${unit.getMeasureUnit().getMeasureUnitName()}"></td>
            <td th:style="${unit.getMeasureUnit().getRatio() == 1.0} ? 'background: yellow;'" th:text="${unit.getMeasureUnit().getRatio()}"></td>
            <td>
                <div sec:authorize="hasRole('ROLE_ADMIN')">
                    <form th:method="DELETE" th:action="@{/groceriesMU/{id}(id=${unit.id})}">
                        <button class="btn btn-danger rounded-pill px-3" type="submit">
                            <ya-tr-span data-index="1-3" data-translated="true" data-source-lang="en" data-target-lang="ru"
                                        data-value="Danger" data-translation="Опасность" data-ch="0" data-type="trSpan"
                                        data-selected="false">
                                Удалить
                            </ya-tr-span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                 class="bi bi-trash3" viewBox="0 0 16 16">
                                <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47ZM8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>


<div th:if="${units.isEmpty()}">У этого продукта нет привязанных единиц измерения</div>


<form th:method="GET" th:action="@{/groceriesMU/new/{id}(id=${product.getId()})}">

    <input type="submit" value="Добавить ед.изм.">
</form>

<!--        <input type="submit" value="Удалить продукт"/>-->
<!--    </form>-->
<!--</div>-->
</body>
</html>

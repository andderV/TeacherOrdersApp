<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">
    <title>Страница редактирования единицы измерения</title>
</head>
<body>
<header th:replace="blocks/header :: header"></header>

<form th:method="PATCH" th:action="@{/groups/{id}(id=${group.getId()})}"
      th:object="${group}">
    <label for="name">Введите название группы: </label>
    <input type="text" th:field="*{groupName}" id="name">
    <div style="color: red" th:if="${#fields.hasErrors('groupName')}" th:errors="*{groupName}">Name error</div>
    <br/>
    <input type="submit" value="Редактировать группу">
</form>
</body>
</html>

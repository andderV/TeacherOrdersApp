<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">
    <title>Страница редактирования продукта</title>
</head>
<body>
<header th:replace="blocks/header :: header"></header>

<form th:method="PATCH" th:action="@{/providers/{id}(id=${provider.getProviderId()})}"
      th:object="${provider}">
    <label for="name">Введите название поставщика: </label>
    <input type="text" th:field="*{providerName}" id="name">
    <div style="color: red" th:if="${#fields.hasErrors('providerName')}" th:errors="*{providerName}">Name error</div>
    <br/>
    <label for="contact">Введите контактное лицо: </label>
    <input type="text" th:field="*{contactPerson}" id="contact">
    <div style="color: red" th:if="${#fields.hasErrors('contactPerson')}" th:errors="*{contactPerson}">Contact error</div>
    <br/>
    <label for="phone">Введите номер телефона: </label>
    <input type="text" th:field="*{phoneNumber}" id="phone">
    <div style="color: red" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">PhoneNumber error</div>
    <br/>
    <label for="email">Введите электронную почту: </label>
    <input type="email" th:field="*{email}" id="email">
    <br/>
    <input type="submit" value="Редактировать поставщика">
</form>
</body>
</html>

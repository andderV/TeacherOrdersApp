<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">

    <title>Страница поставщика</title>
</head>
<body>
<header th:replace="blocks/header :: header"></header>

<a class="btn btn-primary" th:href="@{/contracts/new}" role="button">Добавить новый контракт
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-plus"
         viewBox="0 0 16 16">
        <path d="M8 6.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V11a.5.5 0 0 1-1 0V9.5H6a.5.5 0 0 1 0-1h1.5V7a.5.5 0 0 1 .5-.5"/>
        <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z"/>
    </svg>
</a>
<br/>
<hr/>

<a th:text="${provider.getProviderName()} + ' ' + ${provider.getContactPerson()} + ' ' + ${provider.getPhoneNumber()} +
                                            ' ' + ${provider.getEmail()}"></a>
<br/>
<div th:if="${!contracts.isEmpty()}">
    <hr/>
    <h3>Контракты:</h3>
    <div th:each="contract: ${contracts}">
        <a th:href="@{/contracts/{id}(id=${contract.getContractId()})}"
           th:text="${contract.getContractName()}">Contract</a>
    </div>
</div>
<br/>
<div th:if="${contracts.isEmpty()}">У этого контрагента нет ни одного контракта</div>

<hr/>

<div sec:authorize="hasRole('ROLE_ADMIN')">
    <form th:method="GET" th:action="@{/providers/{id}/edit(id=${provider.getProviderId()})}">

        <input type="submit" value="Редактировать поставщика">
    </form>

    <form th:method="DELETE" th:action="@{/providers/{id}(id=${provider.getProviderId()})}">
        <input type="submit" value="Удалить поставщика"/>
    </form>
</div>
</body>
</html>
